name: build

# 빌드·테스트 확인용. 릴리스는 CI 를 쓰지 않고 scripts/release.sh 로 로컬에서 만든다.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Fetch rhwp (sparse, pinned) and apply patches
        shell: bash
        run: ./scripts/fetch-rhwp.sh

      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --release

      - name: Build (macOS universal app bundle)
        if: runner.os == 'macOS'
        run: |
          UNIVERSAL=1 ./scripts/bundle-macos.sh
          lipo -info dist/HWP2PDF.app/Contents/MacOS/hwp2pdf
          mkdir -p out
          ditto -c -k --keepParent dist/HWP2PDF.app "out/HWP2PDF_${{ steps.ver.outputs.version }}_macos_universal.zip"

      - name: Build (Windows exe)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release
          mkdir -p out
          cp target/release/hwp2pdf.exe "out/HWP2PDF_${{ steps.ver.outputs.version }}_windows_x86_64.exe"

      - name: Smoke test (CLI conversion)
        shell: bash
        run: |
          BIN=target/release/hwp2pdf
          [ -f dist/HWP2PDF.app/Contents/MacOS/hwp2pdf ] && BIN=dist/HWP2PDF.app/Contents/MacOS/hwp2pdf
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version
          mkdir -p smoke
          cp third_party/rhwp/saved/111exam_social.hwp smoke/ 2>/dev/null || true
          ls smoke/*.hwp >/dev/null 2>&1 || { echo "no sample; skip"; exit 0; }
          for f in pdfa docx md txt html; do "$BIN" --format $f smoke; done
          ls -la smoke

      - uses: actions/upload-artifact@v4
        with:
          name: hwp2pdf-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
